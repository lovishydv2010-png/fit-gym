<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Fitness Gym - Build strength, confidence and a healthier lifestyle.">

  <title>Fitness Gym | Train Strong. Feel Stronger.</title>

  <style>
    /* =========================
       BASIC SETTINGS
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.96);
      border-bottom: 1px solid #292929;
    }

    nav {
      max-width: 1200px;
      height: 70px;
      margin: auto;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff3b30;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 28px;
    }

    .nav-links a {
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #ff3b30;
    }

    .nav-btn {
      background: #ff3b30;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
    }

    .menu-btn {
      display: none;
      font-size: 30px;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.65),
          rgba(0, 0, 0, 0.85)
        ),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1800&q=85");

      background-size: cover;
      background-position: center;
    }

    .hero-content {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 120px 20px 70px;
    }

    .hero h1 {
      max-width: 850px;

      font-size: clamp(45px, 7vw, 85px);
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
    }

    .hero h1 span {
      color: #ff3b30;
    }

    .hero p {
      max-width: 620px;
      margin: 25px 0;

      font-size: 19px;
      color: #ddd;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;

      padding: 14px 25px;

      border: 2px solid #ff3b30;
      border-radius: 6px;

      font-weight: bold;

      cursor: pointer;
      transition: 0.3s;
    }

    .btn-primary {
      background: #ff3b30;
    }

    .btn-primary:hover {
      background: white;
      color: black;
      border-color: white;
    }

    .btn-outline:hover {
      background: #ff3b30;
    }

    /* =========================
       GENERAL SECTIONS
    ========================== */

    section {
      padding: 90px 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 42px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-title p {
      max-width: 650px;
      margin: auto;
      color: #aaa;
    }

    /* =========================
       WHY US
    ========================== */

    .benefits {
      background: #111;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: #181818;
      padding: 30px;

      border: 1px solid #292929;
      border-radius: 10px;

      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: #ff3b30;
    }

    .icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .card h3 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .card p {
      color: #aaa;
    }

    /* =========================
       ABOUT
    ========================== */

    .about {
      background: #0b0b0b;
    }

    .about-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;

      align-items: center;
    }

    .about-image {
      width: 100%;
      min-height: 400px;

      object-fit: cover;

      border-radius: 12px;
    }

    .about-text h2 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .about-text p {
      color: #bbb;
      margin-bottom: 18px;
    }

    /* =========================
       FACILITIES
    ========================== */

    .facilities {
      background: #111;
    }

    .facility-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .facility {
      min-height: 220px;

      padding: 30px;

      background: #1a1a1a;

      border: 1px solid #292929;
      border-radius: 10px;
    }

    .facility h3 {
      color: #ff3b30;
      font-size: 23px;
      margin-bottom: 15px;
    }

    .facility ul {
      list-style: none;
      color: #ccc;
    }

    .facility li {
      padding: 5px 0;
    }

    .facility li::before {
      content: "✓ ";
      color: #ff3b30;
      font-weight: bold;
    }

    /* =========================
       SPECIAL OFFER
    ========================== */

    .offer {
      text-align: center;

      background:
        linear-gradient(
          rgba(255, 59, 48, 0.9),
          rgba(180, 20, 15, 0.9)
        ),
        url("https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=1800&q=85");

      background-size: cover;
      background-position: center;
    }

    .offer h2 {
      font-size: 50px;
      text-transform: uppercase;
    }

    .offer p {
      max-width: 650px;
      margin: 15px auto 25px;
      font-size: 18px;
    }

    .offer .btn {
      background: white;
      color: black;
      border-color: white;
    }

    /* =========================
       CONTACT
    ========================== */

    .contact {
      background: #0b0b0b;
    }

    .contact-box {
      max-width: 850px;
      margin: auto;

      padding: 40px;

      background: #181818;

      border: 1px solid #292929;
      border-radius: 12px;
    }

    .contact-box form {
      display: grid;
      gap: 15px;
    }

    input,
    textarea {
      width: 100%;

      padding: 15px;

      background: #0e0e0e;

      border: 1px solid
